name: ChopChop
version: '${version}'
main: ru.deelter.chopchop.paper.ChopPlugin
api-version: '1.21.4'
author: DeelTer
description: Server side of the ChopChop mod, cartoon wounds and severed limbs
commands:
  chopchop:
    description: Manage ChopChop
    usage: /chopchop <reload|stats|heal [player]|sever <player> <part|legs> [along]>
permissions:
  chopchop.admin:
    description: Use /chopchop
    default: op
  chopchop.sever:
    description: Cut a part off a player with /chopchop sever
    default: op
